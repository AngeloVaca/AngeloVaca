<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0f1a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b6b"/>
      <stop offset="1" stop-color="#36bcf7"/>
    </linearGradient>
    <radialGradient id="glowRed"><stop offset="0" stop-color="#ff3b6b" stop-opacity=".35"/><stop offset="1" stop-color="#ff3b6b" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowBlue"><stop offset="0" stop-color="#36bcf7" stop-opacity=".30"/><stop offset="1" stop-color="#36bcf7" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1c2536" stroke-width="1"/>
    </pattern>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif}
    .mono{font-family:Consolas,'Courier New',monospace}
    .fade{opacity:0;animation:fade .9s ease forwards}
    .d1{animation-delay:.1s}.d2{animation-delay:.4s}.d3{animation-delay:.7s}.d4{animation-delay:1s}.d5{animation-delay:1.3s}
    @keyframes fade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .flow{stroke-dasharray:6 10;animation:flow 1s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-32}}
    .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 2.2s ease-in-out infinite alternate}
    .b2{animation-delay:.3s}.b3{animation-delay:.6s}.b4{animation-delay:.9s}.b5{animation-delay:1.2s}.b6{animation-delay:1.5s}
    @keyframes grow{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
    .line{stroke-dasharray:320;stroke-dashoffset:320;animation:draw 3s ease-in-out infinite}
    @keyframes draw{0%{stroke-dashoffset:320}60%,100%{stroke-dashoffset:0}}
    .pulse{animation:pulse 1.8s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .float{animation:float 7s ease-in-out infinite alternate}
    @keyframes float{to{transform:translate(40px,-25px)}}
    .blink{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>

  <!-- Fondo -->
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)" opacity=".7"/>
  <circle class="float" cx="160" cy="60" r="220" fill="url(#glowRed)"/>
  <circle class="float" cx="1020" cy="280" r="240" fill="url(#glowBlue)" style="animation-duration:9s"/>

  <!-- Texto -->
  <text class="mono fade d1" x="70" y="96" font-size="18" fill="#7d8590">&lt;hola-mundo /&gt;<tspan class="blink" fill="#36bcf7">_</tspan></text>
  <text class="sans fade d2" x="66" y="168" font-size="66" font-weight="800" fill="#ffffff">Angelo Vaca</text>
  <text class="sans fade d3" x="70" y="214" font-size="27" font-weight="600" fill="url(#accent)">Frontend Developer · Data Engineer</text>
  <text class="sans fade d4" x="70" y="254" font-size="18" fill="#8b949e">Angular  ·  TypeScript  ·  Python  ·  SQL  ·  Power BI</text>
  <rect class="fade d5" x="70" y="276" width="130" height="4" rx="2" fill="url(#accent)"/>

  <!-- Pipeline de datos -->
  <g class="sans fade d3" font-size="14" font-weight="600" text-anchor="middle">
    <rect x="740" y="60" width="110" height="46" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="795" y="88" fill="#c9d1d9">Fuentes</text>
    <rect x="890" y="60" width="110" height="46" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="945" y="88" fill="#c9d1d9">ETL</text>
    <rect x="1040" y="60" width="110" height="46" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="1095" y="88" fill="#c9d1d9">Warehouse</text>
  </g>
  <path class="flow" d="M850 83H890" stroke="#36bcf7" stroke-width="2.5"/>
  <path class="flow" d="M1000 83H1040" stroke="#36bcf7" stroke-width="2.5"/>
  <path class="flow" d="M1095 106V150" stroke="#ff3b6b" stroke-width="2.5"/>
  <circle class="pulse" cx="795" cy="60" r="4" fill="#3fb950"/>

  <!-- Ventana tipo app Angular con dashboard -->
  <g class="fade d4">
    <rect x="740" y="150" width="410" height="140" rx="12" fill="#161b22" stroke="#30363d"/>
    <circle cx="760" cy="168" r="5" fill="#ff5f56"/>
    <circle cx="777" cy="168" r="5" fill="#ffbd2e"/>
    <circle cx="794" cy="168" r="5" fill="#27c93f"/>
    <text class="mono" x="814" y="172" font-size="12" fill="#7d8590">&lt;app-dashboard&gt;</text>
    <line x1="740" y1="184" x2="1150" y2="184" stroke="#30363d"/>

    <rect class="bar"    x="765" y="235" width="20" height="40" rx="3" fill="#ff3b6b"/>
    <rect class="bar b2" x="799" y="210" width="20" height="65" rx="3" fill="#36bcf7"/>
    <rect class="bar b3" x="833" y="225" width="20" height="50" rx="3" fill="#ff3b6b"/>
    <rect class="bar b4" x="867" y="195" width="20" height="80" rx="3" fill="#36bcf7"/>
    <rect class="bar b5" x="901" y="215" width="20" height="60" rx="3" fill="#ff3b6b"/>
    <rect class="bar b6" x="935" y="200" width="20" height="75" rx="3" fill="#36bcf7"/>

    <path class="line" d="M985 262L1015 242L1045 252L1075 214L1105 226L1135 200" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="pulse" cx="1135" cy="200" r="5" fill="#36bcf7"/>
  </g>
</svg>
