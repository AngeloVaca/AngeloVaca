<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270">
  <defs>
    <linearGradient id="red" x1="0" x2="1"><stop offset="0" stop-color="#ff3b6b"/><stop offset="1" stop-color="#ff8a5c"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop offset="0" stop-color="#36bcf7"/><stop offset="1" stop-color="#7c5cff"/></linearGradient>
  </defs>
  <style>
    .sans{font-family:'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif}
    .mono{font-family:Consolas,'Courier New',monospace}
    .border{stroke-dasharray:14 8;animation:run 6s linear infinite}
    @keyframes run{to{stroke-dashoffset:-220}}
    .item{opacity:0;animation:in .6s ease forwards}
    .i1{animation-delay:.2s}.i2{animation-delay:.5s}.i3{animation-delay:.8s}.i4{animation-delay:1.1s}
    @keyframes in{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin 10s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>

  <!-- Tarjeta Frontend -->
  <rect x="10" y="10" width="580" height="250" rx="16" fill="#0d1117"/>
  <rect class="border" x="10" y="10" width="580" height="250" rx="16" fill="none" stroke="url(#red)" stroke-width="2"/>
  <circle class="spin" cx="72" cy="66" r="30" fill="none" stroke="url(#red)" stroke-width="2" stroke-dasharray="8 6"/>
  <text class="mono" x="72" y="73" font-size="20" font-weight="700" fill="#ff3b6b" text-anchor="middle">&lt;/&gt;</text>
  <text class="sans" x="120" y="62" font-size="24" font-weight="700" fill="#ffffff">Frontend Development</text>
  <text class="sans" x="120" y="86" font-size="14" fill="#8b949e">Interfaces modernas, rápidas y responsivas</text>
  <g class="sans" font-size="16" fill="#c9d1d9">
    <text class="item i1" x="44" y="138"><tspan fill="#ff3b6b">▹ </tspan>Aplicaciones SPA con Angular y TypeScript</text>
    <text class="item i2" x="44" y="170"><tspan fill="#ff3b6b">▹ </tspan>Componentes reutilizables y diseño responsive</text>
    <text class="item i3" x="44" y="202"><tspan fill="#ff3b6b">▹ </tspan>Consumo de APIs REST y GraphQL</text>
    <text class="item i4" x="44" y="234"><tspan fill="#ff3b6b">▹ </tspan>Prototipado de interfaces en Figma</text>
  </g>

  <!-- Tarjeta Data Engineering -->
  <rect x="610" y="10" width="580" height="250" rx="16" fill="#0d1117"/>
  <rect class="border" x="610" y="10" width="580" height="250" rx="16" fill="none" stroke="url(#blue)" stroke-width="2"/>
  <circle class="spin" cx="672" cy="66" r="30" fill="none" stroke="url(#blue)" stroke-width="2" stroke-dasharray="8 6"/>
  <g fill="none" stroke="#36bcf7" stroke-width="2">
    <ellipse cx="672" cy="56" rx="13" ry="5"/>
    <path d="M659 56V76C659 79 665 81 672 81C679 81 685 79 685 76V56"/>
    <path d="M659 66C659 69 665 71 672 71C679 71 685 69 685 66"/>
  </g>
  <text class="sans" x="720" y="62" font-size="24" font-weight="700" fill="#ffffff">Data Engineering</text>
  <text class="sans" x="720" y="86" font-size="14" fill="#8b949e">De datos crudos a decisiones claras</text>
  <g class="sans" font-size="16" fill="#c9d1d9">
    <text class="item i1" x="644" y="138"><tspan fill="#36bcf7">▹ </tspan>Modelado de bases de datos con SQL</text>
    <text class="item i2" x="644" y="170"><tspan fill="#36bcf7">▹ </tspan>Pipelines y transformación de datos (ETL)</text>
    <text class="item i3" x="644" y="202"><tspan fill="#36bcf7">▹ </tspan>Dashboards e informes en Power BI</text>
    <text class="item i4" x="644" y="234"><tspan fill="#36bcf7">▹ </tspan>Análisis de datos con Python y NumPy</text>
  </g>
</svg>
